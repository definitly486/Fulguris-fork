name: Release large-screen-toolbar

on:
  push:
    branches: [ large-screen-toolbar ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-large-screen-toolbar
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # The repo has local developer paths committed (SDK dir and aapt2 override).
    # They do not exist on the runner, so drop them for CI only.
    - name: Remove local SDK paths
      run: |
        rm -f local.properties
        sed -i '/^android.aapt2FromMavenOverride=/d' gradle.properties
        grep -n "aapt2" gradle.properties || echo "aapt2 override removed"

    # F-Droid flavor does not need Firebase / google-services, release build type
    # is signed with the debug key per app/build.gradle so the APK is installable.
    - name: Build release APK
      run: ./gradlew assembleSlionsFullFdroidRelease --no-daemon

    - name: Collect APK
      id: apk
      run: |
        APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
        echo "Found: $APK"
        mkdir -p dist
        cp "$APK" "dist/Fulguris-large-screen-toolbar-${GITHUB_RUN_NUMBER}.apk"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: fulguris-release-apk
        path: dist/*.apk

    - name: Publish GitHub pre-release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: large-screen-toolbar-${{ github.run_number }}
        name: Large screen toolbar build ${{ github.run_number }}
        prerelease: true
        target_commitish: ${{ github.sha }}
        files: dist/*.apk
