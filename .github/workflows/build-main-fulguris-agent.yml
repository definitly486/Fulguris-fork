name: Agent

on:
  push:
    branches: [ main, feature/socks5-proxy ]
  pull_request:
    branches: [ main, feature/socks5-proxy ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Validate resource XML and show revision
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          git log -1 --oneline
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for path in glob.glob("app/src/main/res/values*/strings.xml"):
              ET.parse(path)
              print("XML OK:", path)
          PY
          grep -R -n -F 'pref_key_socks5_proxy' app/src/main/res/values app/src/main/res/xml || true
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build Agent variant
        run: ./gradlew assembleSlionsFullAgent --stacktrace
