name: Google Play

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: set up JDK 17
      uses: actions/setup-java@v2
      with:
        java-version: '17'
        distribution: 'adopt'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # gradle.properties and local.properties contain developer paths that do not exist on the runner
    - name: Remove local SDK paths
      run: |
        rm -f local.properties
        sed -i '/^[[:space:]]*android\.aapt2FromMavenOverride[[:space:]]*=/d' gradle.properties
        grep -n "aapt2" gradle.properties || echo "aapt2 override removed"
    - name: Build Slions Google Play variants
      run: ./gradlew assembleSlionsFullPlaystore
